# Agent and safety settings. Safety rules are never learned.
safety:
  min_green: 5                 # s
  yellow: 3                    # s
  max_clearance_hold: 30       # s
  clearance_speed: 1.07        # m/s design walking speed
  exit_full_ratio: 0.85
  stale_after: 10              # s

# Fixed priority order used by every master (highest first)
priority_order: [safety, emergency, supermaster_directive, transit, pedestrian, normal]

traffic_light:                 # max-pressure parameters (tuned by training)
  ped_weight: 0.5
  switch_margin: 0.0
  downstream_queued_only: true
  fallback_fixed_green: 30
  actuated_gap: 3
  actuated_max_green: 45

pedestrian:
  max_wait: 45                 # s, rule fallback: request a walk signal after this
  heat_max_wait: 30            # during heat (weather directive)

transit:
  late_factor: 1.5             # gap > 1.5 x headway = late bus
  detect_distance: 120         # m
  max_extension: 20            # s

emergency:
  detect_distance: 200         # m
  prepare_horizon: 40          # s, route coordinator warns junctions this far ahead

incident:
  persist: 45                  # s (rule fallback)
  min_confidence: 0.6

weather:
  rain_extra_yellow: 1         # s added to yellow in rain (directive)
  rain_extra_clearance: 3      # s added to clearance in rain

predictive:                    # MPC traffic light agent (tuned by training)
  ped_person: 1.0              # a waiting pedestrian weighs like this many waiting cars
  ped_urgency: 30              # s: pedestrian cost doubles after this much waiting
  sat_flow: 0.5                # vehicles/s/lane discharged on green
  min_gain: 0.0                # switch only if predicted waiting drops by this share

corridor:
  platoon_weight: 0.3          # tuned by training
  horizon: 20                  # s of upstream travel counted as "arriving soon"

rerouting:
  min_saving: 20               # s per vehicle

congestion:                    # incident agent also publishes plain congestion
  halting: 10                  # stopped vehicles on one road
  persist: 45                  # s before it counts as congestion
  clear_below: 5               # stopped vehicles to clear it

notification:
  peak_level: 0.9              # forecast level that triggers a "peak coming" alert
  ambulance_horizon: 60        # s: warn drivers and pedestrians this far ahead

models_dir: models

model_algorithms:              # per learned agent, chosen from the model benchmark (python scripts/benchmark.py models)
  default: hist_gb             # HistGradientBoosting: tied with the best on the other tasks
  incident: lightgbm           # +13% F1 vs hist_gb, more stable across folds than xgboost
  ambulance_eta: xgboost       # 11% lower error than hist_gb and 5x faster per prediction
  # options: hist_gb, xgboost, lightgbm (missing library -> hist_gb, with a message)

synapse:                       # language agents: set ANTHROPIC_API_KEY or GROQ_API_KEY (optional)
  provider: auto               # auto | anthropic | groq
  languages: [en, fr, ar]
  explainer_model: claude-sonnet-5-5
  copilot_model: claude-sonnet-5-5
  alert_model: claude-haiku-4-5-20251001     # fast and cheap: alerts are short and frequent
  groq_explainer_model: openai/gpt-oss-120b    # Groq retires models: python scripts/check_llm.py lists yours
  groq_copilot_model: openai/gpt-oss-120b
  groq_alert_model: openai/gpt-oss-20b
  copilot_every: 180           # simulated seconds between copilot summaries
  alert_batch_every: 5         # real seconds between alert rewriting batches
